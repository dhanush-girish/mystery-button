<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 560" width="320" height="560" role="img" aria-label="Leaderboard mockup with sample data" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
