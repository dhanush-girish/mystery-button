<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 230" width="980" height="230" role="img" aria-label="The 8-layer anti-cheat pipeline" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="980" height="230" fill="#FFF3C4"/>
  <rect x="4" y="4" width="972" height="222" fill="none" stroke="#111" stroke-width="5"/>
  <text x="70" y="44" font-family="Impact,'Arial Black',sans-serif" font-size="20" fill="#111">REQUEST</text>
  <text x="910" y="44" text-anchor="end" font-family="Impact,'Arial Black',sans-serif" font-size="20" fill="#2a9d4a">SCORE UPDATED</text>
  <line x1="70" y1="95" x2="910" y2="95" stroke="#111" stroke-width="6" stroke-dasharray="2 10" stroke-linecap="round"/>
  <g font-family="Arial,sans-serif" font-weight="bold" text-anchor="middle" fill="#111">
    <g transform="translate(70 95)"><circle r="24" fill="#FFD93D" stroke="#111" stroke-width="4"/><text y="7" font-size="20">1</text><text y="52" font-size="14">Cutoff</text><text y="70" font-size="11" fill="#555">4 PM IST</text></g>
    <g transform="translate(190 95)"><circle r="24" fill="#FFD93D" stroke="#111" stroke-width="4"/><text y="7" font-size="20">2</text><text y="52" font-size="14">Auth</text><text y="70" font-size="11" fill="#555">Clerk JWT</text></g>
    <g transform="translate(310 95)"><circle r="24" fill="#FFD93D" stroke="#111" stroke-width="4"/><text y="7" font-size="20">3</text><text y="52" font-size="14">Cooldown</text><text y="70" font-size="11" fill="#555">2s gap</text></g>
    <g transform="translate(430 95)"><circle r="24" fill="#FFD93D" stroke="#111" stroke-width="4"/><text y="7" font-size="20">4</text><text y="52" font-size="14">Clamp</text><text y="70" font-size="11" fill="#555">15 CPS max</text></g>
    <g transform="translate(550 95)"><circle r="24" fill="#E63946" stroke="#111" stroke-width="4"/><text y="7" font-size="20" fill="#fff">5</text><text y="52" font-size="14">Shadowban</text><text y="70" font-size="11" fill="#555">route clicks</text></g>
    <g transform="translate(670 95)"><circle r="24" fill="#FFD93D" stroke="#111" stroke-width="4"/><text y="7" font-size="20">6</text><text y="52" font-size="14">Rate cap</text><text y="70" font-size="11" fill="#555">1200 / 60s</text></g>
    <g transform="translate(790 95)"><circle r="24" fill="#FFD93D" stroke="#111" stroke-width="4"/><text y="7" font-size="20">7</text><text y="52" font-size="14">Variance</text><text y="70" font-size="11" fill="#555">stddev &lt; 5ms</text></g>
    <g transform="translate(910 95)"><circle r="24" fill="#FFD93D" stroke="#111" stroke-width="4"/><text y="7" font-size="20">8</text><text y="52" font-size="14">CAPTCHA</text><text y="70" font-size="11" fill="#555">~10% chance</text></g>
  </g>
  <circle r="11" fill="#E63946" stroke="#111" stroke-width="3">
    <animateMotion dur="7s" repeatCount="indefinite" path="M70,95 L910,95"/>
  </circle>
  <text x="490" y="190" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#555">Every layer runs on the server. The browser gets no vote.</text>
</svg>
