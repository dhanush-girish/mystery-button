<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Two leaderboards: what the cheater sees versus what everyone else sees" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="400" fill="#FFF3C4"/>
  <rect x="4" y="4" width="892" height="392" fill="none" stroke="#111" stroke-width="5"/>
  <g font-family="Arial,sans-serif" font-weight="bold" fill="#111">
    <!-- Left panel -->
    <rect x="30" y="30" width="380" height="56" fill="#111"/>
    <text x="220" y="66" text-anchor="middle" font-family="Impact,'Arial Black',sans-serif" font-size="24" fill="#FFD93D">WHAT THE CHEATER SEES</text>
    <rect x="30" y="86" width="380" height="250" fill="#fff" stroke="#111" stroke-width="4"/>
    <rect x="46" y="104" width="348" height="58" rx="6" fill="#FFD93D" stroke="#111" stroke-width="3">
      <animate attributeName="opacity" values="1;.7;1" dur="2s" repeatCount="indefinite"/></rect>
    <text x="66" y="141" font-size="20">1</text><text x="100" y="141" font-size="20">CheaterBoy</text><text x="376" y="141" font-size="20" text-anchor="end">50,000</text>
    <rect x="46" y="176" width="348" height="52" rx="6" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="66" y="209" font-size="18">2</text><text x="100" y="209" font-size="18">Alice</text><text x="376" y="209" font-size="18" text-anchor="end">12,000</text>
    <rect x="46" y="240" width="348" height="52" rx="6" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="66" y="273" font-size="18">3</text><text x="100" y="273" font-size="18">Bob</text><text x="376" y="273" font-size="18" text-anchor="end">11,500</text>
    <text x="220" y="322" text-anchor="middle" font-size="12" fill="#777">ranked by score + shadow_score</text>

    <!-- Right panel -->
    <rect x="490" y="30" width="380" height="56" fill="#E63946"/>
    <text x="680" y="66" text-anchor="middle" font-family="Impact,'Arial Black',sans-serif" font-size="24" fill="#fff">WHAT EVERYONE ELSE SEES</text>
    <rect x="490" y="86" width="380" height="250" fill="#fff" stroke="#111" stroke-width="4"/>
    <rect x="506" y="104" width="348" height="58" rx="6" fill="#FFD93D" stroke="#111" stroke-width="3"/>
    <text x="526" y="141" font-size="20">1</text><text x="560" y="141" font-size="20">Alice</text><text x="836" y="141" font-size="20" text-anchor="end">12,000</text>
    <rect x="506" y="176" width="348" height="52" rx="6" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="526" y="209" font-size="18">2</text><text x="560" y="209" font-size="18">Bob</text><text x="836" y="209" font-size="18" text-anchor="end">11,500</text>
    <rect x="506" y="240" width="348" height="52" rx="6" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="526" y="273" font-size="18">3</text><text x="560" y="273" font-size="18">Charlie</text><text x="836" y="273" font-size="18" text-anchor="end">10,800</text>
    <text x="680" y="322" text-anchor="middle" font-size="12" fill="#777">only real, non-banned players</text>

    <!-- Middle label -->
    <text x="450" y="200" text-anchor="middle" font-size="30" fill="#E63946">≠</text>
    <text x="450" y="370" text-anchor="middle" font-size="16">Same server. Two realities. The cheater has no idea.</text>
  </g>
</svg>
