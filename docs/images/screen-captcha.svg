<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 560" width="320" height="560" role="img" aria-label="CAPTCHA challenge mockup" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="10" y="10" width="300" height="540" rx="32" fill="#111"/>
  <rect x="20" y="24" width="280" height="512" rx="22" fill="#FFF3C4"/>
  <rect x="20" y="24" width="280" height="512" rx="22" fill="#000" opacity=".45"/>
  <rect x="40" y="130" width="240" height="300" rx="12" fill="#fff" stroke="#111" stroke-width="4"/>
  <text x="160" y="170" text-anchor="middle" font-family="Impact,'Arial Black',sans-serif" font-size="26" fill="#E63946">ROBOT CHECK!</text>
  <text x="160" y="196" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="14" fill="#111">Tap the STAR within 5 seconds</text>

  <polygon points="85,262 65,296 105,296" fill="#4CC9F0" stroke="#111" stroke-width="3"/>
  <g transform="translate(168 292)"><polygon points="0,-34 8.23,-11.33 32.34,-10.51 13.32,4.33 19.98,27.51 0,14 -19.98,27.51 -13.32,4.33 -32.34,-10.51 -8.23,-11.33" fill="#FFD93D" stroke="#111" stroke-width="3">
    <animateTransform attributeName="transform" type="scale" values="1;1.12;1" dur="1s" repeatCount="indefinite"/></polygon></g>
  <circle cx="110" cy="364" r="24" fill="#E63946" stroke="#111" stroke-width="3"/>
  <rect x="190" y="344" width="44" height="44" fill="#7BD389" stroke="#111" stroke-width="3"/>

  <rect x="60" y="408" width="200" height="12" rx="6" fill="#ddd" stroke="#111" stroke-width="2"/>
  <rect x="60" y="408" width="200" height="12" rx="6" fill="#E63946">
    <animate attributeName="width" values="200;0" dur="5s" repeatCount="indefinite"/></rect>
  <text x="160" y="476" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#fff">Tap the background? That counts as a fail.</text>
