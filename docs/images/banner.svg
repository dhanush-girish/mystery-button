<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="The Mystery Button banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.6" fill="#000" opacity=".13"/></pattern>
  </defs>
  <rect width="900" height="300" fill="#FFD93D"/>
  <rect width="900" height="300" fill="url(#dots)"/>
  <rect x="6" y="6" width="888" height="288" fill="none" stroke="#111" stroke-width="6"/>
  <g font-family="Impact,'Arial Black',sans-serif" font-size="74">
    <text x="50" y="140" fill="#111">THE MYSTERY</text>
    <text x="44" y="134" fill="#E63946">THE MYSTERY</text>
    <text x="50" y="222" fill="#111">BUTTON</text>
    <text x="44" y="216" fill="#fff">BUTTON</text>
  </g>
  <text x="46" y="266" font-family="Arial,sans-serif" font-weight="bold" font-size="20" fill="#111">One button. Zero chill. Infinite clicks.</text>

  <g transform="translate(745 150)">
    <circle r="100" cy="12" fill="#111"/>
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;0.93;1" dur="1.2s" repeatCount="indefinite"/>
      <circle r="92" fill="#E63946" stroke="#111" stroke-width="6"/>
      <ellipse cx="-28" cy="-42" rx="34" ry="16" fill="#fff" opacity=".35" transform="rotate(-25 -28 -42)"/>
      <text y="30" text-anchor="middle" font-family="Impact,'Arial Black',sans-serif" font-size="96" fill="#fff" stroke="#111" stroke-width="3">?</text>
    </g>
  </g>

  <g font-family="Impact,'Arial Black',sans-serif" font-size="34" fill="#111">
    <text x="610" y="90">+1<animate attributeName="y" values="110;40" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="1.8s" repeatCount="indefinite"/></text>
    <text x="830" y="80">+1<animate attributeName="y" values="100;30" dur="1.8s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="0.6s" repeatCount="indefinite"/></text>
    <text x="690" y="60">+1<animate attributeName="y" values="80;15" dur="1.8s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="1.2s" repeatCount="indefinite"/></text>
  </g>
</svg>
