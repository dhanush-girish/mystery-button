<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 560" width="320" height="560" role="img" aria-label="Game screen mockup" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="10" y="10" width="300" height="540" rx="32" fill="#111"/>
  <rect x="20" y="24" width="280" height="512" rx="22" fill="#FFF3C4"/>
  <rect x="34" y="40" width="120" height="58" rx="6" fill="#fff" stroke="#111" stroke-width="3"/>
  <text x="44" y="58" font-family="Arial,sans-serif" font-weight="bold" font-size="11" fill="#555">SCORE</text>
  <text x="44" y="88" font-family="Impact,'Arial Black',sans-serif" font-size="28" fill="#E63946">1,247</text>
  <rect x="166" y="40" width="120" height="58" rx="6" fill="#111"/>
  <text x="176" y="58" font-family="Arial,sans-serif" font-weight="bold" font-size="11" fill="#FFD93D">TIME LEFT</text>
  <text x="176" y="88" font-family="Impact,'Arial Black',sans-serif" font-size="26" fill="#fff">02:14:33</text>

  <g font-family="Impact,'Arial Black',sans-serif" font-size="26" fill="#111">
    <text x="70" y="200">+1<animate attributeName="y" values="230;150" dur="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite"/></text>
    <text x="236" y="190">+1<animate attributeName="y" values="220;140" dur="1.5s" begin=".5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="1.5s" begin=".5s" repeatCount="indefinite"/></text>
    <text x="150" y="170">+1<animate attributeName="y" values="200;125" dur="1.5s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="1.5s" begin="1s" repeatCount="indefinite"/></text>
  </g>

  <g transform="translate(160 308)">
    <circle r="104" cy="12" fill="#111"/>
    <g><animateTransform attributeName="transform" type="scale" values="1;0.92;1" dur="0.9s" repeatCount="indefinite"/>
      <circle r="98" fill="#E63946" stroke="#111" stroke-width="6"/>
      <ellipse cx="-30" cy="-46" rx="38" ry="18" fill="#fff" opacity=".35" transform="rotate(-25 -30 -46)"/>
      <text y="14" text-anchor="middle" font-family="Impact,'Arial Black',sans-serif" font-size="38" fill="#fff" stroke="#111" stroke-width="2">SMASH!</text></g>
  </g>

  <g>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.1;0.25;0.85;1" dur="5s" repeatCount="indefinite"/>
    <rect x="44" y="456" width="232" height="44" rx="8" fill="#111"/>
    <text x="160" y="484" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="14" fill="#FFD93D">You broke into the TOP 25!</text>
  </g>
  <text x="160" y="520" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#777">sound: on</text>
</svg>
